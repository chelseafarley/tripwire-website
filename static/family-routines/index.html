<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Family Routines — Cast Receiver</title>
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    :root { --bg:#132823; --ink:#fff; --mint:#8be3b3; --muted:#a6c8b8; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family: system-ui, sans-serif; }
    #stage { padding: 36px 48px; min-height: 100vh; }
    .head { display:flex; justify-content:space-between; align-items:flex-start; }
    .eyebrow { color:var(--muted); letter-spacing:2px; font-size:14px; font-weight:800; }
    h1 { margin:8px 0 0; font-size:42px; }
    .clock { text-align:right; }
    .tracks { display:grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap:24px; margin-top:28px; }
    .track { background:#29473e; border-radius:20px; padding:22px; }
    .track.alt { background:#493c5c; }
    .task { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-top:16px; background:rgba(255,255,255,.08); border-radius:16px; padding:18px; }
    .count { font-size:48px; font-weight:800; font-variant-numeric: tabular-nums; }
    .bar { height:10px; background:rgba(255,255,255,.2); border-radius:20px; overflow:hidden; margin-top:14px; }
    .bar > span { display:block; height:100%; background:var(--mint); width:0%; }
    .status { margin-top:18px; color:var(--muted); }
    .placeholder { opacity:.7; margin-top:40px; text-align:center; font-size:22px; }
    .art { width:96px; height:96px; border-radius:18px; object-fit:cover; background:rgba(255,255,255,.12); flex-shrink:0; display:grid; place-items:center; font-size:48px; }
    .art img { width:100%; height:100%; object-fit:cover; border-radius:18px; }
  </style>
</head>
<body>
  <div id="stage">
    <div class="placeholder" id="empty">Waiting for Family Routines session…</div>
    <div id="live" hidden>
      <div class="head">
        <div>
          <div class="eyebrow">NOW PLAYING</div>
          <h1 id="title">Routine</h1>
        </div>
        <div class="clock">
          <div class="eyebrow">Current time</div>
          <div id="clock" style="font-size:36px;font-weight:800"></div>
        </div>
      </div>
      <div class="status" id="forecast"></div>
      <div class="tracks" id="tracks"></div>
    </div>
  </div>
  <script>
    // Custom message namespace must match Flutter CastProtocol.kCastNamespace
    const NAMESPACE = 'urn:x-cast:com.familyroutines.session';
    let session = null;

    const context = cast.framework.CastReceiverContext.getInstance();
    const options = new cast.framework.CastReceiverOptions();
    options.customNamespaces = { [NAMESPACE]: cast.framework.system.MessageType.JSON };
    context.addCustomMessageListener(NAMESPACE, (event) => {
      const msg = event.data;
      if (!msg || !msg.type) return;
      if (msg.type === 'sessionSnapshot' || msg.type === 'sessionUpdated') {
        session = msg.payload && msg.payload.session;
        render();
        context.sendCustomMessage(NAMESPACE, event.senderId, {
          type: 'ack', sessionId: msg.sessionId, revision: msg.revision, commandId: msg.commandId, payload: {}
        });
      }
    });
    context.start(options);

    function remaining(activity) {
      if (!activity) return null;
      if (activity.status === 'paused') return activity.remainingWhenPausedMs || 0;
      if (activity.status === 'expiredAwaitingCompletion') return 0;
      if (activity.status !== 'active' || !activity.deadline) return activity.countdownMs;
      const left = Date.parse(activity.deadline) - Date.now();
      return Math.max(0, left);
    }

    function fmt(ms) {
      if (ms == null) return 'Until complete';
      const sec = Math.ceil(ms / 1000);
      const m = Math.floor(sec / 60).toString().padStart(2,'0');
      const s = (sec % 60).toString().padStart(2,'0');
      return m + ':' + s;
    }

    function artHtml(activity, done) {
      if (done) return '<div class="art" aria-label="Finished">🎉</div>';
      if (!activity) return '<div class="art">⭐</div>';
      const url = activity.castImageUrl;
      const label = activity.semanticLabel || activity.title || 'Activity';
      if (url) {
        // LAN HTTP URL from phone while Cast is active. onerror → illustration placeholder.
        return `<div class="art"><img src="${esc(url)}" alt="${esc(label)}" onerror="this.parentNode.textContent='⭐'"/></div>`;
      }
      return `<div class="art" aria-label="${esc(label)}">⭐</div>`;
    }

    function esc(x) {
      return String(x).replace(/[&<>"']/g, (c) => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    function render() {
      const empty = document.getElementById('empty');
      const live = document.getElementById('live');
      if (!session) { empty.hidden = false; live.hidden = true; return; }
      empty.hidden = true; live.hidden = false;
      document.getElementById('title').textContent = session.routineName || 'Routine';
      document.getElementById('clock').textContent = new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
      const tracks = document.getElementById('tracks');
      tracks.innerHTML = '';
      (session.tracks || []).forEach((t, i) => {
        const current = t.completed ? null : t.activities[t.currentIndex];
        const left = remaining(current);
        const planned = current && current.plannedDurationMs ? current.plannedDurationMs : (current && current.countdownMs);
        const pct = planned && left != null ? Math.max(0, Math.min(100, 100 * (1 - left / planned))) : 0;
        const el = document.createElement('div');
        el.className = 'track' + (i % 2 ? ' alt' : '');
        el.innerHTML = `<div><strong>${esc(t.displayName)}</strong> · ${t.currentIndex}/${t.activities.length}</div>
          <div class="task"><div><div class="eyebrow">${t.completed ? 'FINISHED' : (current && current.status === 'waitingForGroup' ? 'WAITING' : 'NOW')}</div>
          <div style="font-size:28px;font-weight:800">${t.completed ? 'All done' : esc(current ? current.title : '')}</div>
          <div class="count">${t.completed ? '🎉' : (current && current.status === 'waitingForGroup' ? 'Waiting for everyone' : fmt(left))}</div></div>
          ${artHtml(current, t.completed)}</div>
          <div class="bar"><span style="width:${pct}%"></span></div>`;
        tracks.appendChild(el);
      });
    }

    // Receiver renders countdown locally from deadlines — phone is authority for advances.
    setInterval(render, 250);
  </script>
</body>
</html>
